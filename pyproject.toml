[project]
name = "powercuts"
version = "0.1.0"
description = "Archive of GB DNO live powercut feeds"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "tzdata", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110