name: capture

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: capture

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - run: python -m powercuts --dno nged --once --data-dir archive

      - name: Commit new snapshots
        run: |
          git config user.name "capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive
          git commit -m "NGED snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git pull --rebase
          git push