name: capture

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: Capture feeds
        env:
          SPEN_API_KEY: ${{ secrets.SPEN_API_KEY }}
          UKPN_API_KEY: ${{ secrets.UKPN_API_KEY }}
        run: |
          python -m powercuts --dno nged --once --data-dir archive
          python -m powercuts --dno ssen --once --data-dir archive
          python -m powercuts --dno npg --once --data-dir archive
          python -m powercuts --dno spen --once --data-dir archive
          python -m powercuts --dno ukpn --once --data-dir archive
          python -m powercuts --dno enwl --once --data-dir archive

      - name: Commit new snapshots
        run: |
          git config user.name "capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive
          git commit -m "Snapshots $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase --autostash -X theirs
          git push