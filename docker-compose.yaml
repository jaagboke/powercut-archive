services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: powercuts
      POSTGRES_PASSWORD: powercuts
      POSTGRES_DB: powercuts
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  processor-nged:
    build: .
    command: ["python", "-m", "powercuts.process", "--dno", "nged", "--interval", "300"]
    environment:
      DATABASE_URL: postgresql://powercuts:powercuts@db:5432/powercuts
    volumes:
      - ./archive:/app/data
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: